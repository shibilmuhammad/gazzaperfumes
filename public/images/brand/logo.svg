<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="100%" height="100%" fill="none">
  <defs>
    <filter id="softGaze" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Minimal Geometric Emblem: Interlocking luxury G Monogram -->
  <g transform="translate(10, 8)">
    <circle cx="32" cy="32" r="30" stroke="#F4F1E8" stroke-width="1.5" stroke-opacity="0.7"/>
    <circle cx="32" cy="32" r="23" stroke="#F4F1E8" stroke-width="0.75" stroke-opacity="0.35" stroke-dasharray="2 3"/>
    <!-- Stylized G -->
    <path d="M 43 23 C 39 18 31 17 24 20 C 17 24 14 33 16 41 C 19 48 27 52 35 50 C 42 47 45 41 45 34 L 32 34" stroke="#F4F1E8" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter"/>
    <!-- Subtle center scent droplet -->
    <circle cx="32" cy="32" r="1.5" fill="#7A202C"/>
  </g>
  
  <!-- Primary Brand Wordmark -->
  <text x="88" y="42" font-family="'Cormorant Garamond', 'Didot', 'Bodoni MT', serif" font-size="28" font-weight="500" letter-spacing="0.22em" fill="#FAF9F5">GAZZA</text>
  
  <!-- Secondary Descriptor -->
  <text x="90" y="60" font-family="'-apple-system', 'BlinkMacSystemFont', 'Segoe UI', sans-serif" font-size="9" font-weight="400" letter-spacing="0.45em" fill="#C2B8A3" opacity="0.9">PERFUMES</text>
</svg>

  </g>
  
  <!-- Primary Brand Wordmark -->
  <text x="88" y="42" font-family="'Cormorant Garamond', 'Didot', 'Bodoni MT', serif" font-size="28" font-weight="500" letter-spacing="0.22em" fill="#0A0A0A">GAZZA</text>
  
  <!-- Secondary Descriptor -->

    <circle cx="32" cy="32" r="23" stroke="#0D0D0D" stroke-width="0.75" stroke-opacity="0.4" stroke-dasharray="2 3"/>
    <!-- Stylized G -->
    <path d="M 43 23 C 39 18 31 17 24 20 C 17 24 14 33 16 41 C 19 48 27 52 35 50 C 42 47 45 41 45 34 L 32 34" stroke="#0D0D0D" stroke-width="1.75" stroke-linecap="square" stroke-linejoin="miter"/>
